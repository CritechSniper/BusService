<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Station Terminal</title>
  <link rel="stylesheet" href="YAP.css">
</head>

<body>
  <div class="header">
    <h1>Platform Departures</h1>
    <div id="clock">00:00:00</div>
  </div>

  <div id="board" class="board-container">
  </div>
  <footer>
    Book your next trip at 
    <div href="https://buservice.netlify.app/book-a-bus" 
     style="color: #ffda05; text-decoration: underline; margin-left: 5px;">
     <a href="https://buservice.netlify.app/book-a-bus" target="_blank">https://buservice.netlify.app/book-a-bus</a>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBTFjGPz3pPbXDqLxusue9VaQR-Msr_oTk",
        authDomain: "justtest-5f40e.firebaseapp.com",
        databaseURL: "https://justtest-5f40e-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "justtest-5f40e",
        storageBucket: "justtest-5f40e.firebasestorage.app",
        messagingSenderId: "482057327016",
        appId: "1:482057327016:web:299970269b20d58122cd9d",
        measurementId: "G-9V7382JDQ8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const board = document.getElementById('board');
    let buses = [];

    // Helper to generate a random future time (between 3 and 10 minutes from now)
    function getRandomFutureTime(minMinutes = 3, maxMinutes = 10) {
        const now = Date.now();
        const randomMs = Math.floor(Math.random() * (maxMinutes - minMinutes + 1) + minMinutes) * 60 * 1000;
        return new Date(now + randomMs).toISOString();
    }

    function renderBoard() {
        if (!board) return;
        const now = Date.now();

        board.innerHTML = buses.map((bus, i) => {
            if (!bus) return '';
            const etaTime = bus.eta ? new Date(bus.eta).getTime() : now;
            const msLeft = etaTime - now;
            
            const totalWindow = 600000; // 10-minute progress tracking window
            let progress = 100 - (msLeft / totalWindow * 100);
            progress = Math.min(Math.max(progress, 0), 100);

            let timeStr = "ARRIVED";
            if (msLeft > 0) {
                const totalSecs = Math.floor(msLeft / 1000);
                const mins = Math.floor(totalSecs / 60);
                const secs = totalSecs % 60;
                timeStr = `${mins}m ${secs.toString().padStart(2, '0')}s`;
            }

            const etaDate = new Date(bus.eta);
            const timeFormatted = isNaN(etaDate.getTime()) ? "--:--" : etaDate.toLocaleTimeString();
            const a = timeFormatted.split(" ");
            const timyThing = a[0] ? `${a[0].split(":")[0]}:${a[0].split(":")[1]}${a[1] ? ` ${a[1]}` : ""}` : "--:--";

            return `
                <div class="bus-column ${i === 0 ? "col-1" : i === 1 ? "col-2" : "col-3"}">
                    <div class="busDetails">
                        <span>BUS #${i.toString().padStart(3,"0")}</span>
                    </div>
                    <div class="stop-card">
                        <span class="stop-name">${bus.destination || 'N/A'}</span>
                        <div class="stat-box"><span>Seats Available</span><b>${bus.seatnumbers ?? 0}/${bus.maxSeats ?? 0}</b></div>
                    </div>
                    <div class="arrival-footer">
                        <span><span class="pulse"></span> Arriving In</span>
                        <strong>${timeStr} (${timyThing})</strong>
                        <div class="progress-track">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                    </div>
                </div>`;
        }).join('');
    }

    // Realtime listener for buses node
    onValue(ref(db, 'buses'), (snapshot) => {
        const rawData = snapshot.val();
        buses = rawData ? (Array.isArray(rawData) ? rawData : Object.values(rawData)) : [];
        renderBoard();
    });

    // Every 1 second: tick down display, update clock, and check if any bus time has reached zero to reset it in Firebase
    setInterval(async () => {
        const now = Date.now();

        for (let i = 0; i < buses.length; i++) {
            const bus = buses[i];
            if (bus && bus.eta) {
                const etaTime = new Date(bus.eta).getTime();
                // If countdown has reached or passed zero, instantly push a new random future time to Firebase
                if (etaTime <= now) {
                    const busRef = ref(db, `buses/${i}`);
                    await runTransaction(busRef, (currentBus) => {
                        if (currentBus) {
                            const currentEta = currentBus.eta ? new Date(currentBus.eta).getTime() : 0;
                            if (currentEta <= Date.now()) {
                                currentBus.eta = getRandomFutureTime(3, 10);
                            }
                        }
                        return currentBus;
                    });
                }
            }
        }

        renderBoard();
        
        const clock = document.getElementById('clock');
        if (clock) {
            clock.innerText = new Date().toLocaleTimeString([], {
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
            });
        }
    }, 1000);
</script>

</body>
</html>
